# One-time: point the Discover packs release tag at this commit, so the release's source archive holds only this
# README, and remove the old dependency-update branches. Removed right after it runs.
name: Retag release
on:
  push:
    paths: [".github/workflows/retag.yml"]
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          git tag -f discover-packs-v1 && git push -f origin refs/tags/discover-packs-v1
          for b in $(git ls-remote origin 'refs/heads/dependabot/*' | awk '{print $2}'); do git push origin --delete "$b"; done
          git ls-remote --tags origin
